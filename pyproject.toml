[project]
name = "patient-management"
version = "0.1.0"
description = "Deterministic patient state engine for the patient-management Skill"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pm = "patient_management.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patient_management = ["prompts/*.txt", "static/*.css", "static/*.js", "static/*.png", "static/*.svg"]
